<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kas Kelas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- MODAL LOGIN -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6 text-indigo-600">Masuk Aplikasi Kas</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Pilih Hak Akses</label>
          <select id="roleSelect" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" onchange="togglePasswordInput()">
            <option value="guest">Guest (Hanya Melihat)</option>
            <option value="pengurus">Pengurus (Akses Penuh)</option>
          </select>
        </div>
        <div id="passwordGroup" class="hidden">
          <label class="block text-sm font-medium mb-1">Password Pengurus</label>
          <input type="password" id="passwordInput" placeholder="Masukkan password (default: admin123)" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button onclick="login()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">Masuk</button>
      </div>
    </div>
  </div>

  <!-- MAIN NAVBAR -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold">Kas Kelas Digital</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userBadge" class="bg-indigo-800 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">Guest</span>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg transition"><i class="fa-solid fa-right-from-bracket mr-1"></i>Keluar</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    
    <!-- STATS CARDS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500 flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 font-medium">Total Pemasukan</p>
          <h3 id="totalMasuk" class="text-2xl font-bold text-gray-800">Rp 0</h3>
        </div>
        <div class="p-3 bg-green-100 text-green-600 rounded-full"><i class="fa-solid fa-arrow-down text-xl"></i></div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500 flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 font-medium">Total Pengeluaran</p>
          <h3 id="totalKeluar" class="text-2xl font-bold text-gray-800">Rp 0</h3>
        </div>
        <div class="p-3 bg-red-100 text-red-600 rounded-full"><i class="fa-solid fa-arrow-up text-xl"></i></div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500 flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-500 font-medium">Sisa Saldo Kas</p>
          <h3 id="saldoKas" class="text-2xl font-bold text-indigo-600">Rp 0</h3>
        </div>
        <div class="p-3 bg-indigo-100 text-indigo-600 rounded-full"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
      </div>
    </div>

    <!-- GRAFIK & FORM TRANS BERSAMA -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- GRAFIK -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4 text-gray-700">Grafik Keuangan Kas</h2>
        <div class="relative h-64">
          <canvas id="kasChart"></canvas>
        </div>
      </div>

      <!-- FORM TRANSAKSI (KHUSUS PENGURUS) -->
      <div class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4 text-gray-700">Tambah Transaksi</h2>
        <div id="adminTxForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Jenis Transaksi</label>
            <select id="txJenis" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Pemasukan">Pemasukan (+)</option>
              <option value="Pengeluaran">Pengeluaran (-)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Pilih Siswa (Opsional jika pengeluaran)</label>
            <select id="txSiswa" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <!-- Dynamic Options -->
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Jumlah (Rp)</label>
            <input type="number" id="txJumlah" placeholder="Contoh: 10000" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Keterangan</label>
            <input type="text" id="txKeterangan" placeholder="Contoh: Kas Minggu ke-1 / Beli Spidol" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <button onclick="simpanTransaksi()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Simpan Transaksi</button>
        </div>
        <div id="guestTxWarning" class="hidden text-center py-8 text-gray-400">
          <i class="fa-solid fa-lock text-4xl mb-2"></i>
          <p class="text-sm">Login sebagai <b>Pengurus</b> untuk menambah transaksi.</p>
        </div>
      </div>
    </div>

    <!-- KELOLA SISWA & RIWAYAT TRANSAKSI -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- KELOLA SISWA -->
      <div class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4 text-gray-700">Daftar Siswa</h2>
        
        <!-- Form Tambah Nama (Khusus Pengurus) -->
        <div id="adminSiswaForm" class="flex space-x-2 mb-4">
          <input type="text" id="namaSiswaInput" placeholder="Nama Siswa Baru" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          <button onclick="tambahSiswa()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-green-700 transition">Tambah</button>
        </div>

        <div class="max-h-60 overflow-y-auto border rounded-lg divide-y">
          <ul id="listSiswa" class="divide-y">
            <!-- Dynamic List -->
          </ul>
        </div>
      </div>

      <!-- RIWAYAT TRANSAKSI -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4 text-gray-700">Riwayat Transaksi</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="p-3">Tanggal</th>
                <th class="p-3">Siswa / Ket</th>
                <th class="p-3">Jenis</th>
                <th class="p-3">Jumlah</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelTransaksi" class="divide-y">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    // URL Backend Google Apps Script (GANTI DENGAN URL APPS SCRIPT ANDA)
    const API_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI";

    // State Aplikasi
    let currentUserRole = "guest";
    let globalData = { siswa: [], transaksi: [] };
    let chartInstance = null;

    // Inisialisasi
    document.addEventListener("DOMContentLoaded", () => {
      togglePasswordInput();
      initChart();
    });

    function togglePasswordInput() {
      const role = document.getElementById("roleSelect").value;
      const pwdGroup = document.getElementById("passwordGroup");
      pwdGroup.classList.toggle("hidden", role !== "pengurus");
    }

    function login() {
      const role = document.getElementById("roleSelect").value;
      const pwd = document.getElementById("passwordInput").value;

      if (role === "pengurus") {
        if (pwd !== "admin123") { // Password sederhana
          alert("Password Pengurus Salah! (Default: admin123)");
          return;
        }
      }

      currentUserRole = role;
      document.getElementById("loginModal").classList.add("hidden");
      document.getElementById("userBadge").innerText = role;
      
      updateUIByRole();
      loadData();
    }

    function logout() {
      document.getElementById("loginModal").classList.remove("hidden");
    }

    function updateUIByRole() {
      const isPengurus = currentUserRole === "pengurus";
      
      document.getElementById("adminTxForm").classList.toggle("hidden", !isPengurus);
      document.getElementById("guestTxWarning").classList.toggle("hidden", isPengurus);
      document.getElementById("adminSiswaForm").classList.toggle("hidden", !isPengurus);
    }

    // HTTP Requests
    async function loadData() {
      try {
        const response = await fetch(`${API_URL}?action=getData`);
        const result = await response.json();
        if (result.status === "success") {
          globalData = result;
          renderAll();
        }
      } catch (err) {
        console.error("Gagal memuat data:", err);
      }
    }

    async function sendRequest(payload) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.status === "success") {
          loadData();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi!");
      }
    }

    // Render Functions
    function renderAll() {
      renderStats();
      renderSiswaList();
      renderTransaksiTable();
      renderChart();
    }

    function renderStats() {
      let masuk = 0;
      let keluar = 0;

      globalData.transaksi.forEach(tx => {
        if (tx.jenis === "Pemasukan") masuk += tx.jumlah;
        else if (tx.jenis === "Pengeluaran") keluar += tx.jumlah;
      });

      const saldo = masuk - keluar;

      document.getElementById("totalMasuk").innerText = formatRupiah(masuk);
      document.getElementById("totalKeluar").innerText = formatRupiah(keluar);
      document.getElementById("saldoKas").innerText = formatRupiah(saldo);
    }

    function renderSiswaList() {
      const listContainer = document.getElementById("listSiswa");
      const selectSiswa = document.getElementById("txSiswa");
      
      listContainer.innerHTML = "";
      selectSiswa.innerHTML = '<option value="-">-- Pilih Siswa / Umum --</option>';

      globalData.siswa.forEach(siswa => {
        // Render List Siswa
        const li = document.createElement("li");
        li.className = "p-3 flex justify-between items-center text-sm";
        li.innerHTML = `
          <span>${siswa.nama}</span>
          ${currentUserRole === 'pengurus' ? `
            <button onclick="hapusSiswa('${siswa.id}')" class="text-red-500 hover:text-red-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          ` : ''}
        `;
        listContainer.appendChild(li);

        // Render Dropdown Option
        const opt = document.createElement("option");
        opt.value = siswa.nama;
        opt.innerText = siswa.nama;
        selectSiswa.appendChild(opt);
      });
    }

    function renderTransaksiTable() {
      const tbody = document.getElementById("tabelTransaksi");
      tbody.innerHTML = "";

      globalData.transaksi.reverse().forEach(tx => {
        const tr = document.createElement("tr");
        const isMasuk = tx.jenis === "Pemasukan";
        tr.className = "border-b hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-3 text-gray-500">${tx.tanggal}</td>
          <td class="p-3 font-medium">${tx.siswa !== '-' ? tx.siswa : tx.keterangan}</td>
          <td class="p-3">
            <span class="px-2 py-1 text-xs rounded-full ${isMasuk ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
              ${tx.jenis}
            </span>
          </td>
          <td class="p-3 font-semibold ${isMasuk ? 'text-green-600' : 'text-red-600'}">
            ${isMasuk ? '+' : '-'} ${formatRupiah(tx.jumlah)}
          </td>
          <td class="p-3 text-center">
            ${currentUserRole === 'pengurus' ? `
              <button onclick="hapusTransaksi('${tx.id}')" class="text-red-500 hover:text-red-700">
                <i class="fa-solid fa-trash"></i>
              </button>
            ` : '-'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function initChart() {
      const ctx = document.getElementById('kasChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Total Pemasukan', 'Total Pengeluaran'],
          datasets: [{
            label: 'Nominal (Rp)',
            data: [0, 0],
            backgroundColor: ['rgba(34, 197, 94, 0.6)', 'rgba(239, 68, 68, 0.6)'],
            borderColor: ['rgb(34, 197, 94)', 'rgb(239, 68, 68)'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderChart() {
      let masuk = 0;
      let keluar = 0;

      globalData.transaksi.forEach(tx => {
        if (tx.jenis === "Pemasukan") masuk += tx.jumlah;
        else if (tx.jenis === "Pengeluaran") keluar += tx.jumlah;
      });

      if (chartInstance) {
        chartInstance.data.datasets[0].data = [masuk, keluar];
        chartInstance.update();
      }
    }

    // User Actions (Pengurus)
    function tambahSiswa() {
      const nama = document.getElementById("namaSiswaInput").value;
      if (!nama) return alert("Masukkan nama siswa!");

      sendRequest({ action: "addSiswa", nama: nama });
      document.getElementById("namaSiswaInput").value = "";
    }

    function hapusSiswa(id) {
      if (confirm("Apakah Anda yakin ingin menghapus nama siswa ini?")) {
        sendRequest({ action: "deleteSiswa", id: id });
      }
    }

    function simpanTransaksi() {
      const jenis = document.getElementById("txJenis").value;
      const siswa = document.getElementById("txSiswa").value;
      const jumlah = document.getElementById("txJumlah").value;
      const keterangan = document.getElementById("txKeterangan").value;

      if (!jumlah || jumlah <= 0) return alert("Masukkan nominal jumlah uang yang valid!");

      sendRequest({
        action: "addTransaksi",
        jenis: jenis,
        siswa: siswa,
        jumlah: jumlah,
        keterangan: keterangan || "-"
      });

      // Clear Form
      document.getElementById("txJumlah").value = "";
      document.getElementById("txKeterangan").value = "";
    }

    function hapusTransaksi(id) {
      if (confirm("Hapus catatan transaksi ini?")) {
        sendRequest({ action: "deleteTransaksi", id: id });
      }
    }

    // Utilities
    function formatRupiah(number) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: 0
      }).format(number);
    }
  </script>
</body>
</html>
